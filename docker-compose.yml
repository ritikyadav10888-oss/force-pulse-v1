services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forcepulse
      POSTGRES_PASSWORD: forcepulse
      POSTGRES_DB: forcepulse
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forcepulse']
      interval: 5s
      retries: 10

volumes:
  pgdata:
