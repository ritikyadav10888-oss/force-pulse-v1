name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forcepulse
          POSTGRES_PASSWORD: forcepulse
          POSTGRES_DB: forcepulse
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forcepulse" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://forcepulse:forcepulse@localhost:5432/forcepulse
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm --filter "./packages/*" build
      - run: pnpm typecheck
      - name: Prisma migrate deploy + drift check
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > "$RUNNER_TEMP/drift.sql"
          # Prisma's schema can't express the partial "one owner per tournament" index, so its diff
          # wants to drop it. Allow exactly that; any other difference is real drift.
          if grep -vE '^\s*$|^--|DROP INDEX "memberships_one_owner_per_tournament"' "$RUNNER_TEMP/drift.sql"; then
            echo "::error::Database schema drifted from prisma/schema.prisma"; exit 1
          fi
      - run: pnpm test
      - run: pnpm build
